<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>课程资料库 · 校园课程工作台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar"><div class="topbar-inner">
  <div class="brand"><span class="dot"></span>今天</div>
  <nav class="nav">
    <a href="index.html">今天</a>
    <a href="schedule.html">课表</a>
    <a href="ddl.html">DDL</a>
    <a href="notes.html">笔记库</a>
  </nav>
  <div class="top-extra"><a href="schedule.html" style="color:#7A8291">← 返回课表</a></div>
</div></div>

<div class="wrap" id="page">
  <div class="course-head" id="head"></div>
  <div id="hintBox"></div>

  <div class="card" style="margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px">
      <h2 style="margin:0">课程笔记 <span class="sub">所见即所得 · 自动保存 · 可拖拽调大</span></h2>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span class="note-date" id="noteDate"></span>
        <button class="btn small" onclick="exportCurrent()">导出 Word</button>
        <button class="btn small primary" onclick="saveNote()">存入资料库</button>
      </div>
    </div>
    <div class="notion-toolbar" id="toolbar">
      <button class="tb" title="标题1" onclick="fmtBlock('H1')">H1</button>
      <button class="tb" title="标题2" onclick="fmtBlock('H2')">H2</button>
      <button class="tb" title="标题3" onclick="fmtBlock('H3')">H3</button>
      <span class="sep"></span>
      <button class="tb" title="加粗" onclick="fmtCmd('bold')"><b>B</b></button>
      <button class="tb" title="行内代码" onclick="fmtCodeInline()">`</button>
      <span class="sep"></span>
      <button class="tb" title="无序列表" onclick="fmtCmd('insertUnorderedList')">•</button>
      <button class="tb" title="有序列表" onclick="fmtCmd('insertOrderedList')">1.</button>
      <button class="tb" title="待办" onclick="fmtTodo()">☑</button>
      <button class="tb" title="引用" onclick="fmtBlock('blockquote')">"</button>
      <button class="tb" title="代码块" onclick="fmtBlock('pre')">code</button>
      <span class="sep"></span>
      <button class="tb" title="标记没听懂" onclick="fmtUnclear()">❓</button>
    </div>
    <div class="editor-panel" id="editorPanel">
      <div class="note-editor" id="note" contenteditable="true" spellcheck="false"></div>
      <div class="resize-handle" id="resizeHandle" title="拖拽调整高度"></div>
      <div class="foot" style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;flex-wrap:wrap;gap:8px">
        <span class="save-state" id="saveState"></span>
        <span class="muted">「存入资料库」直写 data/notes.json，首次需授权选择 data 文件夹</span>
      </div>
    </div>
  </div>

  <div class="course-layout">
    <div class="card" style="margin:0">
      <h2>课件库 <span class="sub">拖文件进对话说「放进这门课」即可归档</span></h2>
      <div id="files"></div>
    </div>
    <div class="card" style="margin:0">
      <h2>AI 陪读问答 <span class="sub">带课件上下文，问完沉淀成重点本</span></h2>
      <div class="qa-q" id="quickQs"></div>
      <div class="editor" style="margin-bottom:14px">
        <textarea id="qInput" rows="2" placeholder="输入你的问题，例如：第 2 周课件的调度算法，帮我对比一下…"></textarea>
        <div class="foot">
          <span class="save-state">问题带着课程上下文复制，粘贴到 WorkBuddy 对话即可</span>
          <button class="btn small primary" onclick="ask()">提问</button>
        </div>
      </div>
      <h3 style="font-size:13px;font-weight:500;margin-bottom:8px">待问清单</h3>
      <div id="pending"></div>
      <h3 style="font-size:13px;font-weight:500;margin:14px 0 8px">问答历史</h3>
      <div id="history"></div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <h2>本课已存笔记 <span class="sub">来自资料库 data/notes.json</span></h2>
    <div id="savedNotes"></div>
  </div>
</div>

<div id="toast"></div>
<script src="data/data.js"></script>
<script src="assets/common.js"></script>
<script>
const DB = window.DB;
const id = new URLSearchParams(location.search).get("id") || "";
const course = DB.courses.find(c=>c.id===id);
const now = new Date();
const noteKey = "course-note-"+id;
const qaKey = "course-qa-"+id;
const sizeKey = "course-note-h-"+id;
const syncedKey = "today-synced-notes";
const WEEK = ["日","一","二","三","四","五","六"];
const weekOfYear = ()=>{const s=new Date(DB.semester_start);const w=Math.floor((now-s)/86400000/7)+1;return w<1?0:w;};

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2800);}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function copy(text,ok){navigator.clipboard.writeText(text).then(()=>toast(ok)).catch(()=>{window.prompt("复制失败，请手动复制：",text);});}
function todayStr(){return now.getFullYear()+"-"+(now.getMonth()+1<10?"0":"")+(now.getMonth()+1)+"-"+(now.getDate()<10?"0":"")+now.getDate();}

if(!course){document.getElementById("page").innerHTML='<div class="card"><div class="empty">未找到课程，<a href="schedule.html" style="color:#185FA5">返回课表</a></div></div>';}
else{
  const cw = DB.courseware.filter(f=>f.course===course.name);
  const myNotes = DB.notes.filter(n=>n.course===course.name);
  const qaList = (DB.qa[course.name]||[]).concat(JSON.parse(localStorage.getItem(qaKey)||"[]"));
  const pending = (DB.qa["待问清单"]||[]).filter(q=>q.includes(course.name)||q.includes(course.id)).map(q=>({q}));

  document.getElementById("head").innerHTML =
    '<div><h1 style="color:#3A4150">'+escapeHtml(course.name)+'</h1>'+
    '<div class="meta">'+escapeHtml(course.teacher)+' · '+escapeHtml(course.room)+' · 第 '+escapeHtml(course.weeks)+' 周 · '+escapeHtml(course.category)+
    (course.note?'<br>'+escapeHtml(course.note):'')+'</div></div>'+
    '<div class="stats"><span class="chip gray">课件 '+cw.length+'</span><span class="chip gray">笔记 '+myNotes.length+'</span><span class="chip gray">问答 '+qaList.length+'</span></div>';
  document.querySelector(".course-head").style.setProperty("--strip", course.color || "#4C82EF");

  const box = document.getElementById("hintBox");
  if(weekOfYear()===0){
    box.innerHTML = '<div class="hint info">本学期还未开始（第 0 周），课件归档后会显示在这里</div>';
  }else{
    const has = cw.some(f=>f.week===weekOfYear());
    box.innerHTML = has
      ? '<div class="hint ok">第 '+weekOfYear()+' 周的课件已归档 ✓</div>'
      : '<div class="hint warn">第 '+weekOfYear()+' 周的课件还没归档 —— 把文件拖进对话说「放进 '+escapeHtml(course.name)+'」即可</div>';
  }

  const filesEl = document.getElementById("files");
  if(!cw.length){
    filesEl.innerHTML = '<div class="empty">还没有课件，把 PPT/PDF 拖给 WorkBuddy 归档</div>';
  }else{
    const groups = {};
    cw.sort((a,b)=>a.week-b.week).forEach(f=>{ (groups["第"+f.week+" 周"]=groups["第"+f.week+" 周"]||[]).push(f); });
    filesEl.innerHTML = Object.keys(groups).map(wk=>
      '<div style="font-size:12.5px;color:#7A8291;font-weight:500;margin:10px 0 8px">'+wk+'</div>'+
      groups[wk].map(f=>'<div class="file-row"><div class="ic">档</div>'+
        '<div><div class="fn">'+escapeHtml(f.filename)+'</div><div class="fm">'+f.size+' · '+f.added_at+'</div></div>'+
        '<a class="open" href="'+escapeHtml(f.path)+'" target="_blank">打开 →</a></div>').join("")
    ).join("");
  }

  document.getElementById("noteDate").textContent = "今天 · "+todayStr()+" · 第 "+weekOfYear()+" 周";

  /* ===== WYSIWYG 编辑器 ===== */
  const ed = document.getElementById("note");
  const local = JSON.parse(localStorage.getItem(noteKey)||"null");
  const seed = myNotes.length ? myNotes[myNotes.length-1].content : "";
  const startMd = (local&&local.content) || seed || "";
  ed.innerHTML = NOTE_LIB.mdToHtml(startMd);

  const h = localStorage.getItem(sizeKey);
  if(h) ed.style.height = h+"px";
  (function(){
    const handle = document.getElementById("resizeHandle");
    let sy=0, sh=0, drag=false;
    handle.addEventListener("mousedown",e=>{drag=true;sy=e.clientY;sh=ed.offsetHeight;e.preventDefault();});
    document.addEventListener("mousemove",e=>{if(!drag)return;let nh=Math.max(320,Math.min(1000,sh+e.clientY-sy));ed.style.height=nh+"px";});
    document.addEventListener("mouseup",()=>{if(drag){drag=false;localStorage.setItem(sizeKey,ed.offsetHeight);}});
  })();

  let timer=null;
  ed.addEventListener("input",()=>{
    const st=document.getElementById("saveState");
    st.textContent="编辑中…";
    clearTimeout(timer);
    timer=setTimeout(()=>{
      localStorage.setItem(noteKey,JSON.stringify({content:NOTE_LIB.htmlToMd(ed),updatedAt:new Date().toISOString()}));
      const t=new Date();
      st.textContent="已自动保存 "+String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");
    },2000);
  });
  document.getElementById("saveState").textContent = local&&local.updatedAt ? "上次保存 "+local.updatedAt.replace("T"," ").slice(5,16) : "所见即所得，输入自动保存，不丢稿";

  function fmtCmd(cmd){ ed.focus(); document.execCommand(cmd,false,null); }
  function fmtBlock(tag){
    ed.focus();
    document.execCommand("formatBlock",false,tag==="blockquote"?"blockquote":(tag==="pre"?"pre":tag.toLowerCase()));
  }
  function fmtCodeInline(){
    ed.focus();
    const sel = window.getSelection();
    if(sel.rangeCount){ const r=sel.getRangeAt(0); r.deleteContents(); r.insertNode(document.createTextNode("`")); }
    document.execCommand("insertText",false,"`");
    ed.focus();
  }
  function fmtTodo(){
    ed.focus();
    const html = '<div class="todo"><span class="box"></span><span>待办事项</span></div>';
    document.execCommand("insertHTML",false,html);
  }
  function fmtUnclear(){
    ed.focus();
    document.execCommand("insertText",false,"❓没听懂：");
  }
  ed.addEventListener("click",e=>{
    if(e.target.classList&&e.target.classList.contains("box")){
      e.target.parentElement.classList.toggle("done");
      ed.dispatchEvent(new Event("input"));
    }
  });
  window.fmtCmd=fmtCmd; window.fmtBlock=fmtBlock; window.fmtCodeInline=fmtCodeInline; window.fmtTodo=fmtTodo; window.fmtUnclear=fmtUnclear;

  /* ===== 存入资料库（直写文件） ===== */
  window.saveNote = async ()=>{
    const md = NOTE_LIB.htmlToMd(ed).trim();
    if(!md){toast("先写点内容再保存");return;}
    const note = {id:"n"+Date.now(), date:todayStr(), course:course.name, week:weekOfYear(), content:md};
    let res;
    try{ res = await NOTE_LIB.saveNote(note); }
    catch(e){ res = {ok:false, reason:"error", msg:e.message}; }
    if(res && res.ok){
      localStorage.removeItem(noteKey);
      toast("已存入资料库 data/notes.json ✓（笔记库可见，可导出 Word）");
      renderSaved(res.notes || null);
    }else{
      const synced = JSON.parse(localStorage.getItem(syncedKey)||"[]");
      synced.push({...note, synced_at:new Date().toISOString()});
      localStorage.setItem(syncedKey,JSON.stringify(synced));
      const prompt = "请把这条课程笔记追加到 data/notes.json（并重新生成 data/data.js）：\n"+JSON.stringify(note,null,2);
      copy(prompt,"已存本地草稿。授权失败时请把提示词粘贴给 WorkBuddy 写入资料库");
      renderSaved(null);
    }
  };

  /* ===== 导出当前笔记为 Word ===== */
  window.exportCurrent = ()=>{
    const md = NOTE_LIB.htmlToMd(ed).trim();
    if(!md){toast("先写点内容再导出");return;}
    NOTE_LIB.exportDocx(course.name+"-"+todayStr()+"-笔记", md).then(kind=>toast(kind==="docx"?"Word 已生成（.docx）":"Word 已生成（.doc 兼容格式）"));
  };
  window.exportNote = (n)=>{
    NOTE_LIB.exportDocx(n.course+"-"+n.date+"-笔记", n.content).then(kind=>toast(kind==="docx"?"Word 已生成（.docx）":"Word 已生成（.doc 兼容格式）"));
  };

  /* ===== 本课已存笔记列表 ===== */
  function renderSaved(live){
    const el = document.getElementById("savedNotes");
    const list = (live || DB.notes).filter(n=>n.course===course.name).sort((a,b)=>b.date.localeCompare(a.date));
    if(!list.length){ el.innerHTML = '<div class="empty">还没有存入资料库的笔记，写点内容点「存入资料库」</div>'; return; }
    el.innerHTML = list.map(n=>
      '<div class="note-card"><div class="nc-head">'+
      '<span class="badge ok">资料库</span><span class="nc-date">'+n.date+' · 第 '+n.week+' 周</span>'+
      '</div><div class="nc-body">'+escapeHtml(n.content.slice(0,160))+(n.content.length>160?"…":"")+'</div>'+
      '<div class="nc-tools"><button class="btn small" onclick="exportNote('+JSON.stringify(n).replace(/"/g,"&quot;")+')">导出 Word</button></div></div>'
    ).join("");
  }
  renderSaved(null);

  /* ===== AI 问答（不变） ===== */
  const quick = ["总结这周课件的 5 个重点","帮我讲讲没听懂的地方","把本课所有内容整理成复习提纲"];
  document.getElementById("quickQs").innerHTML = quick.map(q=>'<button class="btn small" onclick="askWith(\''+q+'\')">'+q+'</button>').join("");

  const pendEl = document.getElementById("pending");
  pendEl.innerHTML = pending.length
    ? pending.map(p=>'<div class="pending-item"><span style="flex:1">'+escapeHtml(p.q)+'</span><button class="btn small" onclick="askWith(\''+escapeHtml(p.q).replace(/'/g,"\\'")+'\')">现在问</button></div>').join("")
    : '<div class="empty" style="padding:14px">清单是空的。笔记里标记「❓没听懂」，问题会自动出现在这里</div>';

  const hisEl = document.getElementById("history");
  hisEl.innerHTML = qaList.length ? qaList.slice().reverse().map(q=>
    '<div class="qa-item"><div class="q">Q：'+escapeHtml(q.question)+'</div>'+
    '<div class="a">'+escapeHtml(q.answer_digest||"（已提问，等 WorkBuddy 回复后沉淀到此处）")+'</div>'+
    '<div class="when">'+q.asked_at+(q.related_files&&q.related_files.length?' · 关联课件 '+q.related_files.length+' 份':'')+'</div></div>'
  ).join("") : '<div class="empty" style="padding:14px">还没有问答记录，问一个试试</div>';

  window.askWith = q=>ask(q);
  window.ask = function(pre){
    const q = (pre||document.getElementById("qInput").value).trim();
    if(!q){toast("先输入问题");return;}
    const prompt = "关于《"+course.name+"》这门课，请结合 docs/"+course.name+"/ 下的课件和我的笔记回答：\n\n"+q;
    copy(prompt,"已复制问题。粘贴给 WorkBuddy，它会读课件回答，并沉淀到问答历史");
    const local = JSON.parse(localStorage.getItem(qaKey)||"[]");
    local.push({asked_at:new Date().toISOString().slice(0,16).replace("T"," "),question:q,answer_digest:"（已提问，等 WorkBuddy 回复后沉淀到此处）"});
    localStorage.setItem(qaKey,JSON.stringify(local));
    document.getElementById("qInput").value="";
    hisEl.innerHTML = local.slice().reverse().map(x=>'<div class="qa-item"><div class="q">Q：'+escapeHtml(x.question)+'</div><div class="a">'+escapeHtml(x.answer_digest)+'</div><div class="when">'+x.asked_at+'</div></div>').join("") + hisEl.innerHTML;
  };
}
</script>
</body>
</html>
